[tool.poetry]
name = "test_secrets"
version = "0.1.0"
description = "Service for secret messages"
authors = ["kimfb <vasiliev.vlmir@gmail.com>"]
readme = "README.md"
package-mode = false
packages = [
    { include = "app" }
]

[tool.poetry.dependencies]
python = ">=3.12"
fastapi = ">=0.115.2,<0.116.0"
pydantic-settings = "^2.0"
uvicorn = {extras = ["standard"], version = "^0.34.2"}
sqlalchemy = "^2.0.40"
redis = "^6.0.0"
asyncpg = "^0.30.0"
bcrypt = "^4.3.0"
alembic = "^1.15.2"
psycopg2 = "^2.9.10"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"